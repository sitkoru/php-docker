name: Main

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {version: 7.2.34, branch: "7.2"}
          - {version: 7.4.33, branch: "7.4"}
          - {version: 8.0.30, branch: "8.0"}
          - {version: 8.1.34, branch: "8.1"}
          - {version: 8.2.35, branch: "8.2"}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build fpm image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/${{ matrix.branch }}/Dockerfile
          push: false
          target: fpm
          load: true
          platforms: linux/amd64
          tags: php-verify:fpm
      - name: Verify fpm
        run: python3 tests/verify.py php-verify:fpm fpm
      - name: Check PHP 7.2 multipart and session PHPT
        if: matrix.branch == '7.2'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/7.2/Dockerfile
          push: false
          target: regression
          platforms: linux/amd64
      - name: Build dev image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/${{ matrix.branch }}/Dockerfile
          push: false
          target: dev
          load: true
          platforms: linux/amd64
          tags: php-verify:dev
      - name: Verify dev
        run: python3 tests/verify.py php-verify:dev dev
      - name: Build ssh image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/${{ matrix.branch }}/Dockerfile
          push: false
          target: ssh
          load: true
          platforms: linux/amd64
          tags: php-verify:ssh
      - name: Verify ssh
        run: python3 tests/verify.py php-verify:ssh ssh
      - name: Build nginx image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/${{ matrix.branch }}/Dockerfile
          push: false
          target: with-nginx
          load: true
          platforms: linux/amd64
          tags: php-verify:with-nginx
      - name: Verify with-nginx
        run: python3 tests/verify.py php-verify:with-nginx with-nginx
      - name: Build nginx with ssh image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/${{ matrix.branch }}/Dockerfile
          push: false
          target: with-nginx-ssh
          load: true
          platforms: linux/amd64
          tags: php-verify:with-nginx-ssh
      - name: Verify with-nginx-ssh
        run: python3 tests/verify.py php-verify:with-nginx-ssh with-nginx-ssh

  legacy:
    name: PHP 5.6
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build PHP 5.6 fpm
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/5.6/Dockerfile
          target: fpm
          platforms: linux/amd64
          load: true
          push: false
          tags: php5-check:fpm
      - name: Check PHP 5.6 CLI and modules
        run: |
          trap 'docker rm -f php5-cli-check >/dev/null 2>&1 || true' EXIT
          timeout 120 docker run --rm --name php5-cli-check --network none --memory 256m --pids-limit 128 -e PHP_IMAGE_TARGET=fpm -v "$PWD/versions/5.6/tests:/checks:ro" php5-check:fpm sh /checks/smoke.sh
      - name: Check PHP 5.6 FPM request
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/5.6/Dockerfile
          target: verify
          platforms: linux/amd64
          push: false
      - name: Check PHP 5.6 upstream PHPT and upload progress
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/5.6/Dockerfile
          target: regression
          platforms: linux/amd64
          push: false
      - name: Build PHP 5.6 dev
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/5.6/Dockerfile
          target: dev
          platforms: linux/amd64
          load: true
          push: false
          tags: php5-check:dev
      - name: Check PHP 5.6 dev CLI and modules
        run: |
          trap 'docker rm -f php5-dev-check >/dev/null 2>&1 || true' EXIT
          timeout 120 docker run --rm --name php5-dev-check --network none --memory 256m --pids-limit 128 -e PHP_IMAGE_TARGET=dev -v "$PWD/versions/5.6/tests:/checks:ro" php5-check:dev sh /checks/smoke.sh
      - name: Build PHP 5.6 nginx
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: versions/5.6/Dockerfile
          target: with-nginx
          platforms: linux/amd64
          load: true
          push: false
          tags: php5-check:nginx
      - name: Check PHP 5.6 nginx HTTP, hook and logs
        run: |
          trap 'docker rm -f php5-nginx-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name php5-nginx-check --network none --memory 256m --pids-limit 128 \
            -e APP_BEFORE_START_SCRIPT=/checks/before-start.sh \
            -v "$PWD/versions/5.6/tests:/checks:ro" \
            -v "$PWD/versions/5.6/tests/nginx-site.conf:/etc/nginx/conf.d/site.conf:ro" \
            -v "$PWD/versions/5.6/tests/nginx-index.php:/var/www/html/index.php:ro" php5-check:nginx
          timeout 120 docker exec php5-nginx-check sh /checks/nginx.sh
          timeout 120 docker exec php5-nginx-check sh /checks/smoke.sh
          docker logs php5-nginx-check > /tmp/php5-nginx.log 2>&1
          grep -q 'GET /php5-log-check ' /tmp/php5-nginx.log
          grep -q 'FastCGI sent in stderr:.*Primary script unknown' /tmp/php5-nginx.log

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, legacy]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Semantic Release
        uses: sitkoru/semantic-release-action@e54e09267524aa4d4c3c4a1780b4fa1c5a1e6d2c # Node.js 24
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.BOT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.BOT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.BOT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.BOT_EMAIL }}