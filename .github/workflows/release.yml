name: "Release"
on:
  release:
    types:
      - released

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {version: 7.4.33, debian: bullseye}
          - {version: 8.0.30, debian: bullseye}
          - {version: 8.1.34, debian: bookworm}
          - {version: 8.2.35, debian: bookworm}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=ghcr.io/sitkoru/php
          VERSION=${{ matrix.version }}
          echo VERSION=${VERSION}
          MAJOR=`echo $VERSION | cut -d. -f1`
          echo MAJOR=${MAJOR}
          MINOR=`echo $VERSION | cut -d. -f2`
          echo MINOR=${MINOR}
          REF=${GITHUB_REF#refs/tags/}
          if [[ $REF =~ ^v.*$ ]]; then
            TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${MAJOR}.${MINOR}"
            TAGS_DEV="${DOCKER_IMAGE}:${VERSION}-dev,${DOCKER_IMAGE}:${MAJOR}.${MINOR}-dev"
            TAGS_SSH="${DOCKER_IMAGE}:${VERSION}-ssh,${DOCKER_IMAGE}:${MAJOR}.${MINOR}-ssh"
            TAGS_NGINX="${DOCKER_IMAGE}:${VERSION}-nginx,${DOCKER_IMAGE}:${MAJOR}.${MINOR}-nginx"
            TAGS_NGINX_SSH="${DOCKER_IMAGE}:${VERSION}-nginx-ssh,${DOCKER_IMAGE}:${MAJOR}.${MINOR}-nginx-ssh"
          else
            TAGS="${DOCKER_IMAGE}:${VERSION}-${{ github.run_id }}"
            TAGS_DEV="${DOCKER_IMAGE}:${VERSION}-${{ github.run_id }}-dev"
            TAGS_SSH="${DOCKER_IMAGE}:${VERSION}-${{ github.run_id }}-ssh"
            TAGS_NGINX="${DOCKER_IMAGE}:${VERSION}-${{ github.run_id }}-nginx"
            TAGS_NGINX_SSH="${DOCKER_IMAGE}:${VERSION}-${{ github.run_id }}-nginx-ssh"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "tags_dev=${TAGS_DEV}" >> "$GITHUB_OUTPUT"
          echo "tags_ssh=${TAGS_SSH}" >> "$GITHUB_OUTPUT"
          echo "tags_nginx=${TAGS_NGINX}" >> "$GITHUB_OUTPUT"
          echo "tags_nginx_ssh=${TAGS_NGINX_SSH}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.BOT_NAME }}
          password: ${{ secrets.BOT_TOKEN }}
      - name: Build fpm image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.prep.outputs.tags }}
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            DEBIAN_VERSION=${{ matrix.debian }}
          target: fpm
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
      - name: Build dev image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.prep.outputs.tags_dev }}
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            DEBIAN_VERSION=${{ matrix.debian }}
          target: dev
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
      - name: Build ssh image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.prep.outputs.tags_ssh }}
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            DEBIAN_VERSION=${{ matrix.debian }}
          target: ssh
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
      - name: Build nginx image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.prep.outputs.tags_nginx }}
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            DEBIAN_VERSION=${{ matrix.debian }}
          target: with-nginx
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
      - name: Build nginx with ssh image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.prep.outputs.tags_nginx_ssh }}
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.version }}
            DEBIAN_VERSION=${{ matrix.debian }}
          target: with-nginx-ssh
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
